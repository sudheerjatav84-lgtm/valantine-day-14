<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultimate Valentine Website</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
overflow:hidden;
}

/* COMMON PAGE */
.page{
height:100vh;
width:100%;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
position:absolute;
top:0;
left:0;
}

/* ================= PAGE 1 ================= */

#page1{
display:flex;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
perspective:1000px;
}

/* 3D Hearts */
.hearts3d span{
position:absolute;
font-size:35px;
animation:float3d 8s linear infinite;
}

@keyframes float3d{
0%{transform:translateY(-10vh) rotateY(0deg);}
100%{transform:translateY(110vh) rotateY(360deg);}
}

.container{
background:white;
padding:40px;
border-radius:20px;
width:350px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
}

button{
margin-top:15px;
padding:12px;
width:100%;
border:none;
background:#ff4d6d;
color:white;
border-radius:20px;
font-size:16px;
cursor:pointer;
}

/* ================= PAGE 2 ================= */

#page2{
background:linear-gradient(135deg,#ff758c,#ff7eb3);
}

.top-title{
color:white;
font-size:35px;
margin-bottom:20px;
}

.love-title{
font-size:40px;
color:white;
margin-bottom:20px;
}

.images{
display:flex;
gap:40px;
}

.images img{
width:250px;
height:250px;
border-radius:20px;
object-fit:cover;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.shayari{
margin-top:20px;
color:white;
font-size:20px;
text-align:center;
max-width:600px;
}

/* Heart Beat */
.heart-beat{
display:inline-block;
animation:heartbeat 1s infinite;
}

@keyframes heartbeat{
0%{transform:scale(1);}
50%{transform:scale(1.3);}
100%{transform:scale(1);}
}

/* ================= PAGE 3 ================= */

#page3{
background:black;
color:white;
text-align:center;
}

.stars{
position:absolute;
width:100%;
height:100%;
background:url('https://i.ibb.co/0jQkK0x/stars.png');
animation:starsMove 50s linear infinite;
}

@keyframes starsMove{
from{background-position:0 0;}
to{background-position:1000px 1000px;}
}

.universe-text{
font-size:40px;
background:linear-gradient(45deg,#ff7eb3,#ff758c,#ffdde1);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:40px;
}

.love-planet{
font-size:80px;
cursor:pointer;
animation:planetGlow 2s infinite alternate;
}

@keyframes planetGlow{
from{filter:drop-shadow(0 0 10px pink);}
to{filter:drop-shadow(0 0 40px red);}
}

/* ================= PAGE 4 ================= */

#page4{
background:radial-gradient(circle,#1a001a,#000);
color:white;
text-align:center;
}

.iloveyou{
font-size:80px;
background:linear-gradient(45deg,#ff4d6d,#ff99ac,#ffd6e0);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:40px;
}

/* Ring Animation */
.ring{
width:120px;
height:120px;
border:5px solid gold;
border-radius:50%;
animation:ringPulse 2s infinite;
}

@keyframes ringPulse{
0%{transform:scale(1);opacity:1;}
100%{transform:scale(1.5);opacity:0;}
}

</style>
</head>

<body>

<!-- ================= PAGE 1 ================= -->
<div class="page" id="page1">

<div class="hearts3d">
<span style="left:10%">❤️</span>
<span style="left:30%">💖</span>
<span style="left:50%">💕</span>
<span style="left:70%">💗</span>
<span style="left:90%">💘</span>
</div>

<div class="container">
<h1>Happy Valentine’s Day 💘</h1>

<input id="boyName" placeholder="Boy Name">
<input id="girlName" placeholder="Girl Name">

<input type="file" id="boyPhoto">
<input type="file" id="girlPhoto">

<button onclick="goPage2()">Enter Love Page ❤️</button>
</div>

</div>

<!-- ================= PAGE 2 ================= -->
<div class="page" id="page2">

<!-- Mashup Song -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/u3YWMd9YV4o?autoplay=1&loop=1&playlist=u3YWMd9YV4o"
allow="autoplay">
</iframe>

<h1 class="top-title">Happy Valentine’s Day ❤️</h1>

<h1 class="love-title" id="loveNames"></h1>

<div class="images">
<img id="boyImg">
<img id="girlImg">
</div>

<div class="shayari">
Tum meri zindagi ka sabse khoobsurat ehsaas ho ❤️
</div>

<button onclick="goPage3()">Next 💫</button>

<button onclick="addToInstaStory()">Add To Insta Story 📸</button>

</div>

<!-- ================= PAGE 3 ================= -->
<div class="page" id="page3">

<div class="stars"></div>

<div class="universe-text">
Even Infinity Feels Small With You ✨
</div>

<div class="love-planet" onclick="goPage4()">💖</div>

</div>

<!-- ================= PAGE 4 ================= -->
<div class="page" id="page4">

<div class="iloveyou">
I LOVE YOU ❤️
</div>

<div class="ring"></div>

</div>

<script>

function goPage2(){

let b=document.getElementById("boyName").value;
let g=document.getElementById("girlName").value;

let bp=document.getElementById("boyPhoto").files[0];
let gp=document.getElementById("girlPhoto").files[0];

document.getElementById("loveNames").innerHTML=
b+' <span class="heart-beat">❤️</span> '+g;

if(bp) document.getElementById("boyImg").src=URL.createObjectURL(bp);
if(gp) document.getElementById("girlImg").src=URL.createObjectURL(gp);

showPage("page2");
}

function goPage3(){ showPage("page3"); }
function goPage4(){ showPage("page4"); }

function showPage(id){
document.querySelectorAll(".page").forEach(p=>p.style.display="none");
document.getElementById(id).style.display="flex";
}

function addToInstaStory(){
alert("Instagram open ho raha hai ❤️");
window.open("https://instagram.com","_blank");
}

</script>

</body>
</html>
